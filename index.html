 <small>Ao concluir um foco, os minutos são registrados no tópico escolhido. “Pular” não registra.</small></div>`;
function pt_(){if(P.run){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));P.run=0}else{P.end=Date.now()+P.left*1000;P.run=1}draw()}
function nxt(){P.m=P.m=='f'?(P.cy%S.c.n?'s':'g'):'f';P.left=dur()*60;P.run=0}
function skip(){if(P.m=='f')P.cy++;nxt();draw()}
function fin(){if(P.m=='f'){S.l.push(Object.assign({d:today(),m:S.c.f},pick(P.sel)));save();P.cy++}nxt();beep();draw()}
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);o.start();o.stop(c.currentTime+1.2)}catch(e){}}
function dp(){const e=$('#pt');if(!e)return;const m=String(Math.floor(P.left/60)).padStart(2,'0')+':'+String(P.left%60).padStart(2,'0');e.textContent=m;$('#pr').style.strokeDashoffset=603.2*(1-P.left/(dur()*60));document.title=P.run?m+' · '+MN[P.m]:BASE}
setInterval(()=>{if(!P.run)return;P.left=Math.max(0,Math.round((P.end-Date.now())/1000));if(P.left<=0)fin();else dp()},250);
const cfg=(k,v)=>{S.c[k]=v;save();if(!P.run&&'fsg'.includes(k))P.left=dur()*60};
V.cfg=()=>`<div class=card><h2>Ajustes</h2><div class=f>
 ${[['f','Foco (min)'],['s','Pausa curta'],['g','Pausa longa'],['n','Focos até a pausa longa'],['w','Meta semanal (h)']].map(([k,l])=>`<label>${l}<input type=number min=1 value=${S.c[k]} style="width:100px" onchange="cfg('${k}',+this.value)"></label>`).join('')}
 <label>Retenção desejada<select onchange="cfg('r',+this.value)">${[.8,.85,.9,.95].map(r=>`<option value=${r} ${S.c.r==r?'selected':''}>${r*100}%</option>`).join('')}</select></label>
 </div></div>
 <div class=card><h2>Conta e sincronização (Firebase)</h2>${fa?(fu?`<p>Conectado como ${esc(fu.email||fu.uid)}. Sincronizando automaticamente.</p><button class=sec onclick="fa.signOut()">Sair</button>`:`<p>Entre para sincronizar entre aparelhos.</p><button class=pri onclick="fa.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message))">Entrar com Google</button>`):'<small>Firebase não configurado: preencha FB_CONFIG no início do script.</small>'}</div>
 <div class=card><h2>Backup</h2><small>Os dados ficam só neste navegador. Gere o backup, copie o texto e guarde; para restaurar, cole-o e clique em Restaurar.</small>
 <p><textarea id=bk rows=5 style="width:100%"></textarea></p><button class=sec onclick="$('#bk').value=JSON.stringify(S)">Gerar backup</button> <button class=sec onclick="rst()">Restaurar</button> <button class=sec style="border-color:var(--r);color:var(--r)" onclick="if(confirm('Apagar todos os dados?')){S={c:S.c};nz();save();draw()}">Apagar tudo</button></div>`;
function rst(){try{const o=JSON.parse($('#bk').value);if(!o.t||!o.l)throw 0;S=o;nz();save();draw()}catch(e){alert('Backup inválido.')}}
const CI=[[4,"Muito alta"],[0,"Muito alta"],[3,"Alta"],[4,"Muito alta"],[1,"M\u00e9dia"],[0,"Muito alta"],[4,"Muito alta"],[2,"M\u00e9dia"],[3,"Alta"],[4,"Muito alta"],[0,"Muito alta"],[1,"M\u00e9dia"],[4,"Muito alta"],[3,"Alta"],[0,"Muito alta"],[4,"Muito alta"],[1,"M\u00e9dia"],[2,"M\u00e9dia"],[4,"Muito alta"],[3,"Alta"],[0,"Muito alta"],[1,"M\u00e9dia"]];
V.cic=()=>{const nx=CI.findIndex((c,j)=>!S.cy[j]),dn=CI.filter((c,j)=>S.cy[j]).length;
 let h=`<div class=card><h2>Ciclo de estudos: ${dn} de ${CI.length} blocos</h2><small>Siga os blocos na ordem; não depende de datas. Cada bloco: 60 min de teoria + questões.</small></div>`;
 if(nx>=0){const k=CI[nx][0],ids=T.map((t,i)=>i).filter(i=>T[i][0]==k&&tst(i)<2).slice(0,3);h+=`<div class=card style="border:2px solid var(--a)"><small>Próximo bloco · ${CI[nx][1]}</small><h2>${nx+1}. ${D[k][0]}</h2>${ids.length?'<small>Tópicos sugeridos:</small><ul>'+ids.map(i=>`<li>${esc(T[i][1])}</li>`).join('')+'</ul>':'<p>Todos os tópicos desta disciplina já estão concluídos: use o bloco para questões e revisão.</p>'}<button class=pri onclick="S.cy[${nx}]=true;save();draw()">Concluir bloco</button></div>`}
 else h+='<div class=card><h2>Ciclo completo 🎉</h2><small>Desmarque blocos abaixo para recomeçar.</small></div>';
 return h+`<div class=card><table>${CI.map((c,j)=>`<tr><td><input type=checkbox aria-label="Bloco ${j+1}" ${S.cy[j]?'checked':''} onchange="S.cy[${j}]=this.checked;save();draw()"></td><td>${j+1}</td><td><i class=dot style="background:${DC[c[0]]}"></i>${D[c[0]][0]}</td><td><small>${c[1]}</small></td></tr>`).join('')}</table></div>`};
const pcs=(a,t)=>t?Math.round(a/t*100):0,cc=p=>p>=80?'var(--a)':p>=60?'var(--w)':'var(--r)';
V.sim=()=>`<div class=card><h2>Registrar simulado</h2><div class=f><label>Data<input type=date id=sd value="${today()}"></label><label>Área/concurso<input id=sa value="Professor Séries Iniciais" style="width:200px"></label><label>Total de questões<input type=number id=stt min=1 class=n></label><label>Acertos<input type=number id=sac min=0 class=n></label><label>Tempo (min)<input type=number id=stm min=0 class=n></label><label>Obs.<input id=sob></label><button class=pri onclick="addS()">Registrar</button></div></div>
 <div class=card><h2>Histórico</h2>${S.m.length?`<div style="overflow-x:auto"><table class=w><tr><th>Data</th><th>Área</th><th>Acertos</th><th>%</th><th>Tempo</th><th>Obs.</th><th></th></tr>${S.m.map((x,j)=>[x,j]).sort((a,b)=>b[0].d.localeCompare(a[0].d)).map(([x,j])=>{const p=pcs(x.a,x.t);return`<tr><td>${br(x.d)}</td><td>${esc(x.n)}</td><td>${x.a}/${x.t}</td><td style="color:${cc(p)};font-weight:800">${p}%</td><td>${x.m?x.m+' min':''}</td><td>${esc(x.o||'')}</td><td><button class=sec aria-label="Excluir" onclick="S.m.splice(${j},1);save();draw()">×</button></td></tr>`}).join('')}</table></div>`:'<small>Nenhum simulado registrado.</small>'}</div>`;
function addS(){const t=+$('#stt').value,a=+$('#sac').value;if(!(t>0)||a<0||a>t)return alert('Confira o total de questões e os acertos.');S.m.push({d:$('#sd').value||today(),n:$('#sa').value,t,a,m:+$('#stm').value||0,o:$('#sob').value});save();draw()}
V.err=()=>{const pend=S.er.filter(x=>!x.r).length;return`<div class=card><h2>Novo erro</h2><div class=f><label>Data<input type=date id=ed value="${today()}"></label><label>Disciplina<select id=ek>${D.map((d,k)=>`<option value=${k}>${d[0]}</option>`).join('')}</select></label><label>Tópico<input id=et></label><label>Questão/assunto<input id=eq></label></div><p><textarea id=ee rows=2 placeholder="O que errei" style="width:100%"></textarea></p><p><textarea id=er rows=2 placeholder="Regra correta" style="width:100%"></textarea></p><button class=pri onclick="addE()">Registrar erro</button></div>
 <div class=card><h2>Caderno de erros · ${pend} sem revisão</h2>${S.er.length?S.er.map((x,j)=>[x,j]).reverse().map(([x,j])=>`<div class=row style="grid-template-columns:1fr auto"><div><small>${br(x.d)} · ${D[x.k][0]}${x.t?' · '+esc(x.t):''}</small><br><b>${esc(x.q||'')}</b><br>Errei: ${esc(x.e||'')}<br><span style="color:var(--a)">Regra: ${esc(x.g||'')}</span></div><div><label class=ck>Revisado<input type=checkbox ${x.r?'checked':''} onchange="S.er[${j}].r=this.checked;save();draw()"></label><button class=sec aria-label="Excluir" onclick="S.er.splice(${j},1);save();draw()">×</button></div></div>`).join(''):'<small>Nenhum erro registrado.</small>'}</div>`};
function addE(){if(!$('#ee').value&&!$('#eq').value)return;S.er.push({d:$('#ed').value||today(),k:+$('#ek').value,t:$('#et').value,q:$('#eq').value,e:$('#ee').value,g:$('#er').value,r:false});save();draw()}
function draw(){$('#nv').innerHTML=TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';rv=0;draw()">${l}</button>`).join('');$('#app').innerHTML=V[tab]();dp()}
draw();
</script></body></html>
